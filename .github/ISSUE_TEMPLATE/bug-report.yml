name: Bug report
description: Report reproducible behavior that is broken or unsafe.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, private ticket content, or exploitable security details. Use the Security contact link for sensitive reports.
  - type: textarea
    id: impact
    attributes:
      label: What happened and who is affected?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Sign in...\n2. Open...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and URL
      placeholder: Chrome on Windows, preview or production URL
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Add sanitized screenshots, console text, or logs with private data removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the backlog for this problem.
          required: true
        - label: I removed secrets and private workspace content from this report.
          required: true
